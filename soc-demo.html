<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Alert-Triage Copilot — Live Simulation</title>
<style>
  :root {
    --ink: #0d1322; --panel: #141c2f; --panel-2: #1a2440; --line: #263353;
    --text: #d7dfee; --muted: #8291ac; --dim: #66738f;
    --tp: #ff6b5e; --fp: #52c97f; --rev: #f0b44c; --tool: #5fd4d0;
    --mono: "Cascadia Mono", Consolas, "SF Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink); color: var(--text);
    font-family: var(--mono); font-size: 12px; line-height: 1.5;
    padding: 14px 14px 18px; overflow-y: auto;
  }
  .eyebrow { color: var(--tool); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; }
  .sub { color: var(--dim); font-size: 10.5px; margin-top: 2px; }
  .counters { color: var(--muted); font-size: 11px; margin: 10px 0 10px; }
  .counters b.tp { color: var(--tp); } .counters b.fp { color: var(--fp); } .counters b.rev { color: var(--rev); }

  .rowline { display: grid; grid-template-columns: 84px 1fr 128px; gap: 10px; align-items: center; }
  .case { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; margin-bottom: 6px; }
  .case[open] { border-color: #35476f; }
  summary { list-style: none; cursor: pointer; padding: 8px 12px; }
  summary::-webkit-details-marker { display: none; }
  summary:hover { background: var(--panel-2); }
  summary:focus-visible { outline: 2px solid var(--tool); outline-offset: -2px; }
  .aid { font-weight: 700; font-size: 11.5px; }
  .aid::before { content: "▸ "; color: var(--dim); }
  details[open] .aid::before { content: "▾ "; }
  .rule { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { font-weight: 700; font-size: 11px; }
  .chip::before { content: "●"; margin-right: 6px; }
  .chip.tp { color: var(--tp); } .chip.fp { color: var(--fp); } .chip.rev { color: var(--rev); }
  .chip.inv { color: var(--tool); font-weight: 400; }
  .pending .rowline { padding: 8px 12px; }
  @media (prefers-reduced-motion: no-preference) {
    .chip.inv::before { animation: invpulse 1.1s ease-in-out infinite; }
    @keyframes invpulse { 50% { opacity: 0.2; } }
  }

  .trail { border-top: 1px solid var(--line); padding: 12px 14px 14px; border-left: 3px solid var(--line); }
  .tpb .trail { border-left-color: var(--tp); }
  .fpb .trail { border-left-color: var(--fp); }
  .revb .trail { border-left-color: var(--rev); }
  .reason { color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere; margin: 10px 0; font-size: 11px; max-height: 150px; overflow-y: auto; }
  .tline { color: var(--tool); margin-top: 6px; overflow-wrap: anywhere; font-size: 11px; }
  .tres { color: var(--muted); overflow-wrap: anywhere; font-size: 11px; }
  .verdictbox { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
  .verdictbox .headline { margin-bottom: 6px; }
  .verdictbox p { margin: 6px 0; font-size: 11.5px; }
  .mitre span { border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin-right: 5px; color: var(--muted); font-size: 10.5px; }
  .actions { margin: 6px 0 0 16px; font-size: 11px; }
  .actions li { margin: 4px 0; }
</style>
</head>

const VERDICT = {
  true_positive:      { cls: "tp",  label: "true positive"  },
  false_positive:     { cls: "fp",  label: "false positive" },
  needs_human_review: { cls: "rev", label: "needs review"   },
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function summarize(tool, r) {
  if (r.error) return "ERROR: " + r.error;
  if (r.note) return r.note;
  if (tool === "lookup_ip_reputation")
    return `${r.reputation} | abuse score ${r.abuse_score}/100 | ${r.city}, ${r.country} (${r.isp})` +
           (r.categories.length ? ` | ${r.categories.join(", ")}` : "");
  if (tool === "get_user_context")
    return `${r.full_name} | ${r.role}, ${r.department} | admin: ${r.is_admin ? "yes" : "no"} | hours: ${r.normal_hours}`;
  if (tool === "get_related_alerts")
    return `${r.count} match(es): ${r.alerts.map((a) => a.id).join(", ")}`;
  if (tool === "lookup_mitre_technique")
    return r.matches.map((m) => `${m.technique_id} ${m.technique_name}`).join(" ; ");
  return JSON.stringify(r).slice(0, 200);
}

function trailHtml(steps) {
  return steps.map((s) => {
    if (s.type === "reasoning")
      return `<div class="reason">[analyst] ${esc(s.text)}</div>`;
    if (s.type === "tool_call")
      return `<div class="tline">├─ ${esc(s.tool)}(${esc(Object.values(s.input).join(", "))})</div>` +
             `<div class="tres">│&nbsp;&nbsp;&nbsp;→ ${esc(summarize(s.tool, s.result))}</div>`;
    return "";
  }).join("");
}

function caseHtml(r) {
  const v = VERDICT[r.verdict.verdict];
  return `<details class="case ${v.cls}b" data-id="${esc(r.alert_id)}">
    <summary><div class="rowline">
      <span class="aid">${esc(r.alert_id)}</span>
      <span class="rule">${esc(r.rule_name)}</span>
      <span class="chip ${v.cls}">${v.label}</span>
    </div></summary>
    <div class="trail">
      ${trailHtml(r.evidence_trail)}
      <div class="verdictbox">
        <div class="headline"><span class="chip ${v.cls}">${v.label}</span>
          · severity ${esc(r.verdict.severity)} · confidence ${r.verdict.confidence}/100</div>
        <p>${esc(r.verdict.summary)}</p>
        <div class="mitre">${r.verdict.mitre_techniques.length
          ? r.verdict.mitre_techniques.map((t) => `<span>${esc(t)}</span>`).join("")
          : `<span>no MITRE techniques</span>`}</div>
        <ul class="actions">${r.verdict.recommended_actions.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>
      </div>
    </div>
  </details>`;
}

function pendingHtml(r) {
  return `<div class="case pending"><div class="rowline">
    <span class="aid">${esc(r.alert_id)}</span>
    <span class="rule">${esc(r.rule_name)}</span>
    <span class="chip inv">investigating…</span>
  </div></div>`;
}

let items = []; // newest first: { r, resolved }
let timers = [];
function schedule(fn, ms) { timers.push(setTimeout(fn, ms)); }

function render() {
  const open = new Set([...document.querySelectorAll("details.case[open]")].map((d) => d.dataset.id));
  document.getElementById("queue").innerHTML =
    items.map((it) => (it.resolved ? caseHtml(it.r) : pendingHtml(it.r))).join("");
  for (const d of document.querySelectorAll("details.case")) {
    if (open.has(d.dataset.id)) d.open = true;
  }
  const done = items.filter((it) => it.resolved).map((it) => it.r);
  const n = (v) => done.filter((r) => r.verdict.verdict === v).length;
  document.getElementById("counters").innerHTML =
    `${done.length}/${DATA.length} triaged · <b class="tp">${n("true_positive")} escalated</b> · ` +
    `<b class="fp">${n("false_positive")} closed</b> · <b class="rev">${n("needs_human_review")} for review</b>`;
}

function runShift() {
  for (const t of timers) clearTimeout(t);
  timers = [];
  items = [];
  render();
  const pool = [...DATA].sort(() => Math.random() - 0.5);

  function maybeRestart() {
    if (items.length === DATA.length && items.every((it) => it.resolved)) {
      schedule(runShift, 7000); // shift complete: breathe, then replay
    }
  }
  function arriveNext() {
    if (pool.length === 0) return;
    const burst = Math.random() < 0.22 ? Math.min(2, pool.length) : 1;
    for (let i = 0; i < burst; i++) {
      const item = { r: pool.shift(), resolved: false };
      items.unshift(item);
      schedule(() => { item.resolved = true; render(); maybeRestart(); }, 1100 + Math.random() * 2200);
    }
    render();
    if (pool.length > 0) schedule(arriveNext, 450 + Math.random() * 2400);
  }
  arriveNext();
}

runShift();
